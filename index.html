<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Merge Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-wrapper">

    <div class="top-bar">
        <div class="score-box">
            <div class="label">SCORE</div>
            <div id="score">0</div>
        </div>

        <div class="title">
            BIG MERGE
        </div>

        <div class="next-box">
            <div class="label">NEXT</div>
            <div id="next-ball"></div>
        </div>
    </div>

    <div class="game-container">

        <canvas id="gameCanvas"></canvas>

        <button id="blast-btn" class="blast-button" type="button" disabled title="每合成出 ball7 获得一次">
            💥 全场爆炸 <span id="blast-count">0</span>
        </button>
        <div id="combo-status" class="combo-status hidden" aria-live="polite"></div>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-title">GAME OVER</div>

            <div class="final-score">
                SCORE
                <span id="final-score">0</span>
            </div>

            <button id="restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <div class="hint">拖动瞄准，松手投放</div>

    <section class="records-card" aria-label="个人历史最高分">
        <div class="record-summary">
            <div><span class="record-label">本机历史最高分</span><strong id="best-score">0</strong></div>
        </div>
    </section>

</div>

<script src="vendor/matter.min.js"></script>
<script src="vendor/decomp.min.js"></script>
<script src="assets/stickers.js"></script>
<script src="assets/collision-data.js"></script>
<script src="sprites.js"></script>
<script src="scores.js"></script>
<script src="game.js"></script>

</body>
</html>
