<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Merge Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-wrapper">

    <div class="top-bar">
        <div class="score-box">
            <div class="label">SCORE</div>
            <div id="score">0</div>
        </div>

        <div class="title">
            BIG MERGE
        </div>

        <div class="next-box">
            <div class="label">NEXT</div>
            <div id="next-ball"></div>
        </div>
    </div>

    <div class="game-container">

        <canvas id="gameCanvas"></canvas>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-title">GAME OVER</div>

            <div class="final-score">
                SCORE
                <span id="final-score">0</span>
            </div>

            <button id="restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <div class="hint">
        Move your mouse to aim · Click to drop
    </div>

</div>

<script src="vendor/matter.min.js"></script>
<script src="vendor/decomp.min.js"></script>
<script src="assets/stickers.js"></script>
<script src="assets/collision-data.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>

</body>
</html>
