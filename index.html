<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Merge Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-wrapper">

    <div class="top-bar">
        <div class="score-box">
            <div class="label">SCORE</div>
            <div id="score">0</div>
        </div>

        <div class="title">
            BIG MERGE
        </div>

        <div class="next-box">
            <div class="label">NEXT</div>
            <div id="next-ball"></div>
        </div>
    </div>

    <div class="game-container">

        <canvas id="gameCanvas"></canvas>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-title">GAME OVER</div>

            <div class="final-score">
                SCORE
                <span id="final-score">0</span>
            </div>

            <button id="restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <div class="hint">拖动瞄准，松手投放</div>

    <section class="records-card" aria-label="历史成绩与排行榜">
        <div class="record-summary">
            <div><span class="record-label">本机最高分</span><strong id="best-score">0</strong></div>
            <div><span class="record-label">当前身份最高分</span><strong id="personal-best">0</strong></div>
        </div>
        <div class="identity-row">
            <span id="identity-display">正在读取身份…</span>
            <span id="server-status" class="offline">本机模式 · 排行榜需连接服务器</span>
        </div>
        <div id="guest-panel" class="auth-panel">
            <label for="guest-name">访客昵称</label>
            <div class="control-row">
                <input id="guest-name" maxlength="18" placeholder="给这台设备起个名字">
                <button id="guest-name-save" type="button">保存名字</button>
            </div>
        </div>
        <div id="account-panel" class="auth-panel">
            <label for="account-name">账号登录 / 注册</label>
            <div class="control-row">
                <input id="account-name" maxlength="18" autocomplete="username" placeholder="2–18 位用户名">
                <input id="account-password" type="password" maxlength="128" autocomplete="current-password" placeholder="至少 8 位密码">
            </div>
            <div class="control-row auth-buttons">
                <button id="register-btn" type="button">创建账号</button>
                <button id="login-btn" type="button" class="secondary">登录</button>
                <button id="logout-btn" type="button" class="secondary hidden">退出账号</button>
            </div>
        </div>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <div class="leaderboard-heading">
            <h2>全服最高分</h2>
            <button id="leaderboard-refresh" type="button" class="secondary">刷新</button>
        </div>
        <ol id="leaderboard-list"><li class="empty-rank">启动并连接游戏服务器后显示全服排行</li></ol>
    </section>

</div>

<script src="vendor/matter.min.js"></script>
<script src="vendor/decomp.min.js"></script>
<script src="assets/stickers.js"></script>
<script src="assets/collision-data.js"></script>
<script src="sprites.js"></script>
<script src="scores.js"></script>
<script src="game.js"></script>

</body>
</html>
